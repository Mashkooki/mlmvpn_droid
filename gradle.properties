# Keep project settings portable. Configure a machine-specific JDK, proxy, or
# temporary directory in ~/.gradle/gradle.properties (or through environment
# variables), rather than committing paths that only exist on one workstation.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34,35
